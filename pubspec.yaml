name: visit_log
description: A Flutter app for school supervisors to track daily visits.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.15
  intl: ^0.20.2
  url_launcher: ^6.2.2
  file_picker: ^8.1.2
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^3.0.0
  flutter_localizations:
    sdk: flutter
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/newlogo.png"


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - lib/assets/
    # Also listed as assets (not just under `fonts:`) so the HTML exporter can
    # read the bytes via rootBundle and inline them as base64 @font-face.
    - assets/fonts/thmanyahsans-Regular.otf
    - assets/fonts/thmanyahsans-Bold.otf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Bundled rather than fetched at runtime: the app declares no INTERNET
  # permission, so a network-loaded font would silently fall back in release.
  # Weights are registered under one family so FontWeight.bold on a title
  # resolves to the Bold face and normal body text resolves to Regular.
  fonts:
    - family: ThmanyahSans
      fonts:
        - asset: assets/fonts/thmanyahsans-Regular.otf
        - asset: assets/fonts/thmanyahsans-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyahsans-Bold.otf
          weight: 700

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
